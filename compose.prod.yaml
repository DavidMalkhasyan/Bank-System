# Production on one Ubuntu server (Oracle Cloud, Hetzner, DigitalOcean...):
# PostgreSQL, the app (API + React, built from ./Dockerfile) and Caddy for
# automatic HTTPS. deploy/install.sh creates .env and starts it; see
# docs/deploy-oracle.md. (docker-compose.yml is the development setup.)

# Container logs are rotated (5 x 10 MB each) so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [postgres, -c, shared_buffers=256MB, -c, max_connections=40]
    shm_size: 128mb
    mem_limit: 1g
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ledgerly -d ledgerly]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ledgerly:${POSTGRES_PASSWORD}@db:5432/ledgerly
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CORS_ORIGIN: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env, e.g. ledgerly.duckdns.org}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_RESET_HOURS: ${DEMO_RESET_HOURS:-24}
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  # Front door: HTTPS certificate from Let's Encrypt, HTTP redirected to HTTPS.
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on: [app]
    logging: *logging
    restart: unless-stopped

volumes:
  database:
  caddy_data:
  caddy_config:
