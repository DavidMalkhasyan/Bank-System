# One-click deploy on Render (https://render.com/deploy): a free web service
# built from the root Dockerfile plus a free PostgreSQL database.
services:
  - type: web
    name: ledgerly
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: DEMO_RESET_HOURS
        value: '24'

databases:
  - name: ledgerly-db
    plan: free
