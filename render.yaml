# Render Blueprint (New → Blueprint in the Render dashboard): a free web
# service built from the root Dockerfile. The database is a free Neon
# PostgreSQL project, because Render's own free databases expire after 30 days.
# Create the Neon project in the same region (AWS Europe Central 1, Frankfurt).
services:
  - type: web
    name: ledgerly
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Render asks for this value when the Blueprint is created: paste the Neon connection string.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: DEMO_RESET_HOURS
        value: '24'
